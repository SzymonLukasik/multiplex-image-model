encoder:
    # marker-agnostic branch
    ma_layers_blocks: [1]
    ma_embedding_dims: [16]
    # pan-marker equivariant branch
    # pm_layers_blocks: [2, 2]
    pm_layers_blocks: [4, 4, 4]
    # pm_layers_blocks: [4, 4]
    # pm_embedding_dims: [64, 128]
    # pm_embedding_dims: [128, 256]
    pm_embedding_dims: [192, 384, 768]
    # pm_embedding_dims: [128, 256, 512]
    maximum_frequency: 1
    include_stem: true
    latent_nonlinearity: "none"

    use_gating: true
    use_layerscale: True #True, czemu mialem False przed chwila??
    layerscale_init: 1.0e-6
    gate_bias_init: 1.0
    pool_use_act: true
    # NOTE: must match the checkpoint's training-time architecture. The
    # `from_checkpoint` model (epoch_34) was trained without EquivariantPixelLN,
    # so use_norm must be false here — otherwise load_state_dict reports all
    # pool_norms.* / blocks.*.norm.* as missing keys.
    use_norm: false
    # use_grn: false

    hyperkernel_config:
      embedding_dim: 384
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

decoder:
  decoded_embed_dim: 512
  num_blocks: 1

  hyperkernel_config:
      # embedding_dim == decoded_embed_dim
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

# Data configuration
panel_config: configs/all_panels_config.yaml
tokenizer_config: configs/all_markers_tokenizer.yaml
input_image_size: [113, 113]
num_workers: 2
batch_size: 4

# Training configuration
device: cuda
lr: 5e-4
final_lr: 1e-4
weight_decay: 0.0001
gradient_accumulation_steps: 1
epochs: 200 #250
frac_warmup_steps: 0.1
early_val_epochs: 3
early_val_checks_per_epoch: 5
min_channels_frac: 0.75
spatial_masking_ratio: 0.6
fully_masked_channels_max_frac: 0.5
mask_patch_size: 8
