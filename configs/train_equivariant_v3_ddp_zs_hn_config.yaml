# Fully-equivariant (escnn) V3 autoencoder — anti-collapse transposed-conv decoder.
#
# Mirrors train_masked_config.yaml (vanilla) for everything EXCEPT the model, so
# the equivariant vs vanilla comparison inside this framework stays apples-to-apples
# (same data pipeline, masking, optimizer, resolution target).
#
# The escnn model is memory-heavy at full resolution, so it runs its core at
# `encoder.internal_image_size` (64): the 128x128 input is bilinearly downscaled
# to 64 before the model and the reconstruction is upscaled back to 128, so the
# loss is still computed at 128 by the unchanged training loop.
model_type: fully_equivariant_v3

encoder:
    ma_layers_blocks: [1]
    ma_embedding_dims: [16]
    pm_layers_blocks: [4, 4, 4]
    pm_embedding_dims: [128, 256, 512]
    maximum_frequency: 2
    include_stem: true
    latent_nonlinearity: "none"
    use_gating: true
    use_layerscale: true
    layerscale_init: 1.0e-6
    gate_bias_init: 1.0
    pool_use_act: true
    use_norm: true
    # escnn stride-2 parity: keep plain stride-2 (antialiasing off) with an EVEN
    # internal size (64). Do NOT toggle antialiasing independently of the size.
    antialiased_downsample: false
    antialiased_stem: false
    # Reduced-resolution training: run the escnn core at 64x64 (set null to run at
    # the native input resolution, e.g. to reproduce/load native-res checkpoints).
    internal_image_size: 64
    hyperkernel_config:
      embedding_dim: 128
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true
      intertwiner_basis: full

decoder:
  decoded_field_dim: 128
  num_outputs: 2
  in_block_norm: true
  # anti-collapse knobs (see BLANK_RECON_DIAGNOSIS / the fully-equiv V3 memory):
  max_freq_schedule: [2, 2, 1]     # keep oriented content through the full-res stage
  field_dim_schedule: [128, 96, 64]
  upsample_type: transposed_conv
  upsample_kernel_size: 4
  upsample_padding: 1
  upsample_output_padding: 0
  norm_act_function: n_softplus    # smooth magnitude gate, no ReLU deadzone
  post_refine_norm: true           # restore the between-stage EquivariantPixelLN
  mean_head_bias_init: 0
  hyperkernel_config:
    kernel_size: 1
    padding: 0
    stride: 1
    use_bias: true
    intertwiner_basis: full

# Data configuration
# panel config with tscratch data paths (the upstream all_panels_config.yaml points
# at a /raid_encrypted path that does not exist on this cluster).
panel_config: configs/all_panels_config_tscratch_zs_hn.yaml
tokenizer_config: configs/all_markers_tokenizer.yaml
input_image_size: [128, 128]
num_workers: 8
# escnn is memory-heavy even at internal 64; start small and raise if it fits.
batch_size: 4

data_config:
  # The tscratch data (immuvis_split_patches_onlyarcsinh) is ALREADY arcsinh-
  # transformed, so preprocessing is disabled to avoid double-applying arcsinh.
  preprocessing_func: null
  scaling_func: percentile
  denoising_func: butterworth
  normalization_func: null
  operation_order: [transform, preprocessing, denoising, scaling]
  file_extension: npy
  preprocessing_kwargs: {}
  denoising_kwargs: {}
  scaling_kwargs: {}
  normalization_kwargs: {}

# Training configuration
device: cuda
lr: 5e-4
final_lr: 1e-5
weight_decay: 0.0001
gradient_accumulation_steps: 1
epochs: 200
frac_warmup_steps: 0.1
min_channels_frac: 0.75
spatial_masking_ratio: 0.6
fully_masked_channels_max_frac: 0.5
mask_patch_size: 8
from_checkpoint: last
checkpoints_dir: /net/tscratch/people/plgslukasik/immu-vis/multiplex-image-model/checkpoints_equiv_zs_hn
save_checkpoint_freq: 10
beta: 0.5

# Comet.ml logging configuration.
# No API key set -> init_experiment falls back to an OFFLINE experiment (logs to a
# local .zip under COMET_OFFLINE_DIRECTORY); set COMET_API_KEY in the env to go online.
run_name: equiv-v3-int64-zs-hn
tags: [equivariant, fully_equivariant_v3, internal64, ddp, 2gpu, zeroshot-hn, 200ep]
comet_project: multiplex-equivariant
comet_workspace: null
comet_api_key: null
