# VANILLA (non-equivariant) MultiplexAutoencoder at the "10x" pan-marker dims
# [320, 640, 1280] WITH a progressive decoder.
#
# This is the both-axes-at-once baseline: it moves latent width AND decoder
# structure together, which is the only combination not yet tested.
#
#   latent 768,  pixel_shuffle -> job 3057428  (loses, MSE ratio 1.32)
#   latent 1280, pixel_shuffle -> legacy 10x at 80x80, older repo (still lost)
#   latent 768,  progressive   -> job 3106183  (running)
#   latent 1280, progressive   -> THIS RUN
#
# Parameter count: 259.7M vs the equivariant model's 304.3M (0.85x). Note the
# equivariant latent is 512 fields x 10 real channels = 5120, which this does NOT
# match — matching it literally would need pm [1280, 2560, 5120] = 1.34B params,
# ~4.4x the equivariant model, so raw latent-channel parity is not reachable for a
# vanilla baseline. Parameter parity was separately settled at 97% in section 5 of
# EQUIV_VS_VANILLA_ZSHN_ARCHITECTURE_COMPARABILITY.md.
#
# decoded_embed_dim stays 512 (not the legacy 10x run's 640) so that this differs
# from job 3106183 ONLY in encoder width — that keeps the width effect isolated,
# and it also means decoder-side memory is identical to 3106183.
#
# Everything else (data, masking, optimizer, resolution, batch size, epoch budget)
# is identical to the other zs-hn runs.
model_type: vanilla

encoder:
    # marker-agnostic part
    ma_layers_blocks: [4,]
    ma_embedding_dims: [16,]
    # pan-marker part — the "10x" configuration
    pm_layers_blocks: [4, 4, 4]
    pm_embedding_dims: [320, 640, 1280]
    # Match the equivariant run's reduced-resolution mode: the 128x128 input is
    # bilinearly downscaled to 64 before the model and the reconstruction is
    # upscaled back to 128, so the loss is still computed at 128. Internal 64 with
    # 3 encoder downsamples gives an 8x8 latent, hence 3 upsample stages below.
    internal_image_size: 64

    hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

decoder:
  decoded_embed_dim: 512
  num_blocks: 1

  # Progressive upsampling: 8x8 -> 16 -> 32 -> 64, each stage
  # ConvTranspose2d(k=4,s=2,p=1) -> LayerNorm -> GELU, then a 1x1 readout.
  # Channel schedule mirrors the equivariant V3 field_dim_schedule [128, 96, 64]
  # (ratios 1 : 0.75 : 0.5). Identical to job 3106183.
  upsample_type: progressive
  upsample_dims: [512, 384, 256]

  hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

# Data configuration
# zero-shot-hn panel (27 datasets, 'hn' held out) with tscratch paths — the
# upstream all_panels_config.yaml points at a /raid_encrypted path that does not
# exist on this cluster.
panel_config: configs/all_panels_config_tscratch_zs_hn.yaml
tokenizer_config: configs/all_markers_tokenizer.yaml
input_image_size: [128, 128]
num_workers: 8
batch_size: 8

data_config:
  # tscratch data (immuvis_split_patches_onlyarcsinh) is ALREADY arcsinh-transformed,
  # so preprocessing is disabled to avoid applying arcsinh twice.
  preprocessing_func: null
  scaling_func: percentile
  denoising_func: butterworth
  normalization_func: null
  operation_order: [transform, preprocessing, denoising, scaling]
  file_extension: npy
  preprocessing_kwargs: {}
  denoising_kwargs: {}
  scaling_kwargs: {}
  normalization_kwargs: {}

# Training configuration (identical to the equivariant zs-hn run)
device: cuda
lr: 5e-4
final_lr: 1e-5
weight_decay: 0.0001
gradient_accumulation_steps: 1
epochs: 200
frac_warmup_steps: 0.1
min_channels_frac: 0.75
spatial_masking_ratio: 0.6
fully_masked_channels_max_frac: 0.5
mask_patch_size: 8
from_checkpoint: last
checkpoints_dir: /net/tscratch/people/plgslukasik/immu-vis/multiplex-image-model/checkpoints_vanilla_10x_progdec_zs_hn
save_checkpoint_freq: 10
beta: 0.5

# Comet.ml: no API key -> init_experiment falls back to an offline experiment.
run_name: vanilla-10x-progdec-zs-hn
tags: [vanilla, wide-pm-320-640-1280, progressive-decoder, internal64, 1gpu, zeroshot-hn, 200ep]
comet_project: multiplex-equivariant
comet_workspace: null
comet_api_key: null
